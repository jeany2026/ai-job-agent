            - generic [ref=f22e104]: 高级产品经理（进校方向） 工作要求： 1.负责B端获客体系的产品建设，包括但不限于各类营销玩法、提效工具的需求规划与落地；2.负责面向公立学校的编程上课平台用户运营产品体系搭建，包括但不限于各类活动模板，活动形式的规划与落地。 3.与销售部、市场部、运营部等密切合作，共同为销售、市场等各职能提供效率支持；与其他同事合作，完成公司各类专项验证；4.明确定义产品目标，以数据验证营销活动的效果，持续提升营销效率；5.完成上级交待的其他工作。 工作职责：1.本科及以上学历，至少3~5年工作经验。2.熟练使用产品经理所需的各类常用工具，有B端教育行业相关工作经验优先； 3.有责任心，抗压能力强，具备优秀的沟通、协调能力，能发现并推动解决各类问题。 4.逻辑思维能力，数据分析能力强，能够精准把握市场方向；善于跨部门沟通，善于协调资源推动项目进度；加分项有以下行业经验：在线教育·电子商务·互联网

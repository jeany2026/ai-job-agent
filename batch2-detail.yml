              - generic [ref=f22e140]: 深圳点猫科技有限公司成立于2015年，旗下拥有编程教育品牌“编程猫”，自主研发从PC端到移动端的系列编程软件,面向全球青少年提供覆盖全年龄段和多种编程语言的线上课程、线下学习、赛事等考等服务，并面向教育主管部门及中小学提供人工智能编程教育解决方案，是联合国教科文组织的官方合作伙伴。截至目前，点猫科技累计总用户数已超3800万，服务全国6万余所学校、12万余名信息科技教师。同时还与教育部教育技术与资源发展中心、国内五大教科院等单位，清华大学出版社、湖南教育出版社等国内著名出版社，以及各地省市教研院合作出版130余册人工智能编程教育教材教辅，及100余册科普图书和杂志，全方位引领编程教育行业的发展。期待与你携手启航，以热爱成就价值，为教育梦想添砖加瓦，一起开启精彩职场旅程。（上述数据均参考编程猫内部数据）

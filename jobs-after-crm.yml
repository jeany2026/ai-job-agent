              - paragraph [ref=f2e397]: 岗位 职责： 1.负责膜 类产品（ 手机膜、 平板膜、Switch掌 机膜、镜头膜等）的策划与上市，确保产品满足市场需求。基于用户需求及市场调研，定义产品核心功能、性能参数及包装⽅案，输出产品定义⽂档。 2.通过市场调研、数据分析及竞品监测，洞察⾏业趋势与用户需求，为产品规划提供决策依据。持续跟踪竞品动态，及时调整产品策略。 3.与工业设计、研发、GTM、市场等紧密协作，推动产品从概念到上市的全过程，确保项⽬按时按质交付。 4.监控产品销售数据、用户反馈及市场表现，分析问题并提出优化改进方案，推动产品持续迭代。 5.跟踪行业技术发展及竞争态势，及时调整产品组合，提升市场竞争力。 任职要求： 1.全日制大专及以上学历，至少3年以上产品工作经验，熟悉IPD产品开发模式，市场营销、产品设计或相关专业优先。 2.具备敏锐的市场洞察能力，能准确把握市场趋势和用户需求，善于通过数据驱动产品决策。 3.自驱力强，善于创新，有一定的产品定义能力、跨部门推动能力、数据分析意识、品类理解分析能力； 4、对产品结果负责到底，不推诿、不抱怨，不只是“接需求”，而是主动发现机会并提出解决方案； 加分项 有以下行业经验：新零售·电子商务·批发/零售
